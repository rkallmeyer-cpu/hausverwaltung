const eur = n => new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(n);
const parseAmount = s => { const t=(s||"").replace(/\s|€/g,"").replace(/\./g,"").replace(",","."); const v=parseFloat(t); return isNaN(v)?NaN:v; };
const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDate = iso => { const [y,m,d]=iso.split("-"); return d+"."+m+"."+y; };
const yearOf = iso => (iso||"").slice(0,4);
const uid = () => "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ================= State ================= */
let state, storageOk = true;
let year = String(new Date().getFullYear());
let bkSearch = "", bkFilter = "alle", bkUnit = "alle", bkCat = null; let dashIst = false;
const UMLAGE_TERMS = ["wasser","erdgas","versicherung","nsorgung","nsordung","müll","schornstein"];
function isUmlage(cat) {
  const c = (cat||"").toLowerCase();
  if (c.includes("baumaterial")) return false;
  if (UMLAGE_TERMS.some(t => c.includes(t))) return true;
  return c.includes("gas") && c.includes("abschlag");
}
const CAT_FILTERS = [
  { key:"miete", label:"Miete", match:b => b.category.toLowerCase()==="miete" },
  { key:"nkv", label:"NK-Vorauszahlung", match:b => b.category.toLowerCase().includes("vorauszahlung") },
  { key:"nkr", label:"NK-Rückzahlung", match:b => { const c=b.category.toLowerCase(); return c.includes("rückzahlung")||c.includes("rueckzahlung"); } },
  { key:"zinsen", label:"Zinsen", match:b => b.category.toLowerCase().startsWith("zinsen") },
  { key:"tilgung", label:"Tilgung", match:b => b.category.toLowerCase().includes("tilgung") },
  { key:"wasser", label:"Wasser/Abwasser", match:b => b.category.toLowerCase().includes("wasser") },
  { key:"erdgas", label:"Erdgas", match:b => b.category.toLowerCase().includes("gas") },
  { key:"versicherung", label:"Versicherungen", match:b => b.category.toLowerCase().includes("versicherung") },
  { key:"umlage", label:"Umlagefähig", match:b => b.type==="ausgabe" && isUmlage(b.category) },
  { key:"nicht-umlage", label:"Nicht umlagefähig", match:b => b.type==="ausgabe" && !isUmlage(b.category) }
];
function toggleBkCat(k) { bkCat = (bkCat===k) ? null : k; route(); }

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.projects) && p.projects.length) { state = p; return; }
    }
  } catch (e) { storageOk = false; }
  state = JSON.parse(JSON.stringify(SEED));
  state.activeProjectId = state.projects[0].id;
}
function saveState() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
  catch (e) { storageOk = false; }
}
const project = () => state.projects.find(p => p.id === state.activeProjectId) || state.projects[0];
const years = () => {
  const set = new Set([String(new Date().getFullYear())]);
  state.projects.forEach(p => p.bookings.forEach(b => set.add(yearOf(b.date))));
  return [...set].filter(Boolean).sort((a,b) => Number(b)-Number(a));
};

/* ================= Toast ================= */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, 2600);
}

/* ================= Navigation ================= */
const NAV = [
  { hash: "#dashboard", label: "Dashboard", icon: "dash" },
  { hash: "#buchungen", label: "Buchungen", icon: "book" },
  { hash: "#belege", label: "Belege", icon: "cam" },
  { hash: "#eur", label: "EÜR", icon: "eur" },
  { hash: "#nk", label: "NK-Abrechnung", icon: "eur" },
  { hash: "#objekte", label: "Objekte", icon: "home" },
];
function route() {
  const h = (location.hash || "#dashboard").split("?")[0];
  renderChrome();
  const main = document.getElementById("main");
  if (h === "#buchungen" && location.hash.includes("offen")) { bkFilter = "offen"; }
  if (h === "#dashboard") renderDashboard(main);
  else if (h === "#buchungen") renderBookings(main);
  else if (h === "#belege") renderBelege(main);
  else if (h === "#eur") renderEur(main);
  else if (h === "#nk") renderNk(main);
  else if (h === "#objekte") renderProjects(main);
  else if (h === "#einstellungen") renderSettings(main);
  else renderDashboard(main);
  window.scrollTo(0, 0);
}
function renderChrome() {
  const h = (location.hash || "#dashboard").split("?")[0];

      ${years().map(y => `<option value="${y}" ${y===year?"selected":""}>${y}</option>`).join("")}

/* ================= Dashboard ================= */
function renderDashboard(el) {
  const p = project();
  const bk = p.bookings.filter(b => yearOf(b.date) === year);
  const today = new Date();
  const curY = today.getFullYear();
  const lastD = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
  const cutoff = year < curY ? year+"-12-31" : year === curY
    ? year+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(lastD).padStart(2,"0")
    : year+"-01-01";
  const bkIst = dashIst ? bk.filter(b => b.date <= cutoff) : bk;
  const future = bk.filter(b => b.date > cutoff);
  const futEin = future.filter(b=>b.type==="einnahme").reduce((s,b)=>s+b.amount,0);
  const futAus = future.filter(b=>b.type==="ausgabe").reduce((s,b)=>s+b.amount,0);
  const ein = bkIst.filter(b=>b.type==="einnahme").reduce((s,b)=>s+b.amount,0);
  const aus = bkIst.filter(b=>b.type==="ausgabe").reduce((s,b)=>s+b.amount,0);
  const wkp = bkIst.filter(b=>b.type==="ausgabe"&&b.taxStatus===1).reduce((s,b)=>s+b.amount,0);
  const offen = bkIst.filter(b=>b.type==="ausgabe"&&b.taxStatus===4);
  const offenSum = offen.reduce((s,b)=>s+b.amount,0);

  const mMax = Math.max(1, ...MONTHS.map((_,i) =>
    Math.max(
      bk.filter(b=>b.type==="einnahme"&&parseInt(b.date.slice(5,7))===i+1).reduce((s,b)=>s+b.amount,0),
      bk.filter(b=>b.type==="ausgabe"&&parseInt(b.date.slice(5,7))===i+1).reduce((s,b)=>s+b.amount,0))));
  const chart = MONTHS.map((m,i) => {
    const e = bk.filter(b=>b.type==="einnahme"&&parseInt(b.date.slice(5,7))===i+1).reduce((s,b)=>s+b.amount,0);
    const a = bk.filter(b=>b.type==="ausgabe"&&parseInt(b.date.slice(5,7))===i+1).reduce((s,b)=>s+b.amount,0);
    return `<div class="m"><div class="bars">
      <div class="b in" style="height:${Math.max(e/mMax*118, e>0?3:0)}px" title="Einnahmen ${eur(e)}"></div>
      <div class="b out" style="height:${Math.max(a/mMax*118, a>0?3:0)}px" title="Ausgaben ${eur(a)}"></div>
      </div><div class="mlabel">${m}</div></div>`;
  }).join("");

  const catMap = new Map();
  bk.filter(b=>b.type==="ausgabe").forEach(b => catMap.set(b.category,(catMap.get(b.category)||0)+b.amount));
  const cats = [...catMap.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
  const cMax = cats.length ? cats[0][1] : 1;
  const catBars = cats.length ? cats.map(([c,s]) => `
    <div class="hbar"><div class="row"><span>${esc(c)}</span><b>${eur(s)}</b></div>
    <div class="track"><div class="fill" style="width:${Math.max(4, s/cMax*100)}%"></div></div></div>`).join("")
    : `<div class="empty">Noch keine Ausgaben im ${year}.</div>`;

  const photos = p.bookings.filter(b=>b.photo).slice(0,10);
  const photoStrip = photos.length ? photos.map(b => `
    <button class="gcard" style="width:128px;flex-shrink:0" onclick="openPhoto('${b.id}')">
      <img src="${b.photo}" alt=""><div class="gi"><div class="c">${esc(b.category)}</div>
      <div class="m">${eur(b.amount)} · ${fmtDate(b.date)}</div></div></button>`).join("")
    : `<div class="empty">Noch keine Belege fotografiert – tippe auf „＋“ und halte den Beleg vor die Kamera.</div>`;

  const sub = dashIst ? "Ist bis "+cutoff.split("-").reverse().join(".") : String(year);
  const tog = (on) => "border-radius:99px;padding:5px 12px;font-size:12px;font-weight:"+(on?700:500)+";background:"+(on?"#fff":"transparent")+";color:"+(on?"#2E5A47":"#64748b")+";box-shadow:"+(on?"0 1px 3px rgba(0,0,0,.12)":"none")+";cursor:pointer;border:none";
  el.innerHTML = `
    ${storageOk ? "" : `<div class="storage-banner">⚠️ Speicherung blockiert – Daten gelten nur für diese Sitzung. Nutze <b>Backup exportieren</b> in den Einstellungen!</div>`}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em">Kennzahlen</span>
      <span style="display:flex;background:#f1f5f4;border-radius:99px;padding:2px">
        <button style="${tog(!dashIst)}" onclick="dashIst=false;route()">Gesamtjahr</button>
        <button style="${tog(dashIst)}" onclick="dashIst=true;route()">Ist bis Monatsende</button>
      </span>
    </div>
    <div class="cards">
      <div class="stat"><div class="lbl">Einnahmen</div><div class="val">${eur(ein)}</div><div class="sub">${sub}</div></div>
      <div class="stat"><div class="lbl">Ausgaben</div><div class="val">${eur(aus)}</div><div class="sub">${sub}</div></div>
      <div class="stat dark"><div class="lbl">Zahlungsüberschuss</div><div class="val">${eur(ein-aus)}</div><div class="sub">Einnahmen − Ausgaben</div></div>
      <div class="stat"><div class="lbl">EÜR-Überschuss</div><div class="val">${eur(ein-wkp)}</div><div class="sub">steuerwirksam (nur „Sofort abziehbar“)</div></div>
    </div>
    ${dashIst && future.length ? `<div class="card" style="padding:10px 16px;font-size:12px;color:#64748b">🗓 <b style="color:#1f2937">${future.length} zukünftige Buchungen</b> ausgeblendet (nach dem ${cutoff.split("-").reverse().join(".")}): Einnahmen <b style="color:#3E8E5F">${eur(futEin)}</b> · Ausgaben <b style="color:#475569">${eur(futAus)}</b></div>` : ""}
    ${offen.length ? `<button class="warn" onclick="bkFilter='offen';location.hash='#buchungen'">
      <b>⚠️ ${offen.length} ${offen.length===1?"Beleg":"Belege"} noch zu klären</b>
      <span>${eur(offenSum)} fließen noch nicht in die EÜR ein – jetzt einordnen →</span></button>` : ""}
    <div class="card"><h3>Monatsübersicht ${year}<span style="margin-left:auto;font-size:10px;font-weight:600">🟩 Einnahmen · 🟫 Ausgaben</span></h3>
      <div class="chart">${chart}</div></div>
    <div class="card"><h3>Ausgaben nach Kostenart ${year}</h3>${catBars}<div style="height:8px"></div></div>
    <div class="card"><h3>Letzte fotografierte Belege</h3>
      <div style="display:flex;gap:10px;overflow-x:auto;padding:4px 16px 14px">${photoStrip}</div></div>`;
}

function renderBookings(el) {
  const p = project();
  el.innerHTML = `
    <div class="filters">
      <input type="search" value="${esc(bkSearch)}" placeholder="Suchen …"
        oninput="bkSearch=this.value;renderBookingsList()">
      ${["alle","einnahme","ausgabe","offen","belege"].map(f =>
        `<button class="chip ${bkFilter===f?"on":""}" onclick="bkFilter='${f}';route()">${
          f==="alle"?"Alle":f==="einnahme"?"Einnahmen":f==="ausgabe"?"Ausgaben":f==="offen"?"Offen":"Mit Foto"}</button>`).join("")}
      <span class="count" id="bkcount"></span>
    </div>
    <div class="filters">
      <span class="flbl">Einheit</span>
      ${["alle"].concat(p.units).map(u =>
        `<button class="chip ${bkUnit===u?"on":""}" onclick="bkUnit='${u}';route()">${u==="alle"?"Alle":esc(u)}</button>`).join("")}
      <button class="chip ${bkUnit==="ohne"?"on":""}" onclick="bkUnit='ohne';route()">Ohne</button>
    </div>
    <div class="filters">
      <span class="flbl">Kategorie</span>
      <button class="chip ${!bkCat?"on":""}" onclick="bkCat=null;route()">Alle</button>
      ${CAT_FILTERS.map(f =>
        `<button class="chip ${bkCat===f.key?"on":""}" onclick="toggleBkCat('${f.key}')">${f.label}</button>`).join("")}
    </div>
    <p class="smallhint" id="bksum" style="margin:0 4px 10px"></p>
    <div class="card" id="bklist"></div>
    <p class="smallhint" style="text-align:center">Steuer-Status je Buchung im Bearbeiten-Dialog einordnen.</p>`;
  renderBookingsList();
}
function renderBookingsList() {
  const p = project();
  const q = bkSearch.toLowerCase();
  const catF = CAT_FILTERS.find(f => f.key === bkCat);
  const rows = p.bookings
    .filter(b => yearOf(b.date) === year)
    .filter(b => bkFilter==="alle" ? true : bkFilter==="offen" ? b.taxStatus===4
      : bkFilter==="belege" ? !!b.photo : b.type===bkFilter)
    .filter(b => bkUnit==="alle" ? true : bkUnit==="ohne" ? !b.unit : b.unit===bkUnit)
    .filter(b => !catF || catF.match(b))
    .filter(b => !q || (b.note||"").toLowerCase().includes(q) || b.category.toLowerCase().includes(q)
      || (b.unit||"").toLowerCase().includes(q))
    .sort((a,b) => b.date.localeCompare(a.date));
  const list = document.getElementById("bklist");
  if (!list) return;
  const cnt = document.getElementById("bkcount");
  if (cnt) cnt.textContent = rows.length + " Buchungen";
  const sumEl = document.getElementById("bksum");
  if (sumEl) {
    const sE = rows.filter(b=>b.type==="einnahme").reduce((s,b)=>s+b.amount,0);
    const sA = rows.filter(b=>b.type==="ausgabe").reduce((s,b)=>s+b.amount,0);
    sumEl.innerHTML = `Einnahmen <b style="color:#3E8E5F">${eur(sE)}</b> · Ausgaben <b style="color:#475569">${eur(sA)}</b>`;
  }
  if (!rows.length) { list.innerHTML = `<div class="empty">Keine Buchungen gefunden.<br>Neue Buchung über „＋“ erfassen.</div>`; return; }
  list.innerHTML = rows.map(b => {
    const isPos = b.type === "einnahme" || b.amount < 0;
    return `<div class="bkrow">
      ${b.photo ? `<img class="bkthumb" src="${b.photo}" onclick="openPhoto('${b.id}')">`
        : `<div class="bkicon ${b.type==="einnahme"?"in":""}">${ICONS.eur}</div>`}
      <div class="bkmain">
        <div class="t">${esc(b.category)}${b.unit?` <span class="taxpill" style="background:#e2e8f0;color:#64748b">${esc(b.unit)}</span>`:""}</div>
        <div class="d">${fmtDate(b.date)}${b.note?" · "+esc(b.note):""}</div>
      </div>
      <span class="bkamount ${isPos?"pos":""}">${isPos?"+":"−"} ${eur(Math.abs(b.amount))}</span>
      <span class="taxpill" style="background:${TAX[b.taxStatus].color}">${TAX[b.taxStatus].short}</span>
      <div class="bkactions">
        <button class="iconbtn" onclick="openBooking('${b.id}')" title="Bearbeiten">${ICONS.edit}</button>
        <button class="iconbtn" onclick="delBooking('${b.id}')" title="Löschen">${ICONS.del}</button>
      </div>
    </div>`;
  }).join("");
}
function delBooking(id) {
  const p = project();
  if (!confirm("Diese Buchung wirklich löschen?")) return;
  p.bookings = p.bookings.filter(b => b.id !== id);
  saveState(); route(); toast("Buchung gelöscht");
}

  W3: { mieter: "Patrick Kretschmer", flaeche: 100, personen: 1, mietbeginn: "2025-01-01", umlage: true },
  G1: { mieter: "Pferdehof (Janine Martin)", flaeche: 0, personen: 0, mietbeginn: "2025-01-01", umlage: false }
};
function unitMetaOf(p, unit) {
  if (p.unitMeta && p.unitMeta[unit]) return p.unitMeta[unit];
  return UNIT_DEFAULTS[unit] || { mieter: unit, flaeche: 0, personen: 0, mietbeginn: year+"-01-01", umlage: false };
}
function daysInYear(y) { return ((y%4===0 && y%100!==0) || y%400===0) ? 366 : 365; }
function miettage(beginn, y) {
  const yS = Date.UTC(y,0,1), yE = Date.UTC(y+1,0,1);
  const b = beginn ? Date.parse(beginn) : yS;
  if (isNaN(b) || b >= yE) return 0;
  return Math.round((yE - Math.max(b,yS)) / 86400000);
}
function inUmlage(b) { return b.nkUmlage === true || (b.nkUmlage !== false && isUmlage(b.category)); }
let nkDraft = null;
function renderNk(el) {
  const p = project();
  const mOf = u => unitMetaOf(p, u);
  const uUnits = p.units.filter(u => mOf(u).umlage && mOf(u).flaeche > 0);
  const D = uUnits.reduce((s,u) => s + mOf(u).flaeche, 0) * daysInYear(year);
  const wOf = u => mOf(u).flaeche * miettage(mOf(u).mietbeginn, year);
  const kand = p.bookings
    .filter(b => b.type === "ausgabe" && yearOf(b.date) === year)
    .filter(b => b.nkUmlage !== undefined || isUmlage(b.category))
    .sort((a,b) => a.date.localeCompare(b.date));
  const anteile = kand.map(b => {
    const a = {};
    uUnits.forEach(u => { a[u] = Math.round(b.amount * wOf(u) / D * 100) / 100; });
    a.LS = Math.round((b.amount - uUnits.reduce((s,u) => s + a[u], 0)) * 100) / 100;
    return { b, a };
  });
  const umg = anteile.filter(x => inUmlage(x.b));
  const umgSum = umg.reduce((s,x) => s + x.b.amount, 0);
  const lsSum = umg.reduce((s,x) => s + x.a.LS, 0);
  const kostenanteil = u => umg.reduce((s,x) => s + x.a[u], 0);
  const vorauszahlung = u => p.bookings
    .filter(b => b.type === "einnahme" && yearOf(b.date) === year && b.unit === u
      && b.category.toLowerCase().includes("vorauszahlung"))
    .reduce((s,b) => s + b.amount, 0);

  const unitCard = u => {
    const m = mOf(u), ka = kostenanteil(u), vz = vorauszahlung(u), erg = vz - ka;
    return `<div class="card" style="padding:14px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span class="taxpill" style="background:#E6F3EE;color:#2E5A47">${u}</span>
        <b style="font-size:14px;color:#1f2937">${esc(m.mieter)}</b>
      </div>
      <div style="font-size:11px;color:#94a3b8;margin-bottom:8px">
        ${m.flaeche} m² · ${miettage(m.mietbeginn, year)} Miettage${D>0 ? ` · Anteil ${(wOf(u)/D*100).toFixed(1)}%` : ""}</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:#64748b">
        <span>Kostenanteil</span><b style="color:#1f2937">${eur(ka)}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:#64748b">
        <span>Vorauszahlung bezahlt</span><b style="color:#1f2937">${eur(vz)}</b></div>
      <div style="border-top:1px solid #eef2f1;margin-top:6px;padding-top:6px;display:flex;justify-content:space-between;font-size:14px">
        <b style="color:#475569">${erg >= 0 ? "Guthaben" : "Nachzahlung"}</b>
        <b style="color:${erg >= 0 ? "#3E8E5F" : "#C25B4A"}">${erg >= 0 ? "+" : "−"} ${eur(Math.abs(erg))}</b>
      </div>
    </div>`;
  };
  const nichtUml = p.units.filter(u => !uUnits.includes(u));
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div>
        <h2 style="font-size:17px;color:#1f2937">NK-Abrechnung ${year}</h2>
        <p style="font-size:11px;color:#94a3b8">Schlüssel: Fläche × Miettage · Leerstand bleibt beim Eigentümer</p>
      </div>
      <button class="btn outline" style="margin-left:auto" onclick="openNkMeta()">✎ Stammdaten</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px">
      <div class="card" style="padding:12px"><div style="font-size:11px;color:#94a3b8">Umlagefähige Kosten</div>
        <div style="font-size:17px;font-weight:700;color:#1f2937">${eur(umgSum)}</div>
        <div style="font-size:10px;color:#94a3b8">${umg.length} Belege</div></div>
      <div class="card" style="padding:12px"><div style="font-size:11px;color:#94a3b8">Leerstandsanteil</div>
        <div style="font-size:17px;font-weight:700;color:#C89B3C">${eur(lsSum)}</div>
        <div style="font-size:10px;color:#94a3b8">trägt der Eigentümer</div></div>
      <div class="card" style="padding:12px"><div style="font-size:11px;color:#94a3b8">Umlage auf Mieter</div>
        <div style="font-size:17px;font-weight:700;color:#1f2937">${eur(umgSum - lsSum)}</div>
        <div style="font-size:10px;color:#94a3b8">${uUnits.join(" · ")}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px">
      ${uUnits.map(unitCard).join("")}
    </div>
    ${nichtUml.map(u => {
      const vz = vorauszahlung(u);
      return `<div class="card" style="padding:12px;background:#fdf8ee;border:1px solid #eedfc4">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="taxpill" style="background:#f3e8cc;color:#97701e">${u}</span>
          <b style="font-size:14px;color:#1f2937">${esc(mOf(u).mieter)}</b>
          <span style="margin-left:auto;font-size:10px;font-weight:700;color:#97701e">nicht umgelegt</span>
        </div>
        <p style="font-size:12px;color:#64748b;margin-top:6px">${vz > 0
          ? `Vorauszahlungen im ${year}: ${eur(vz)} – nicht umlagefähig, separat mit dem Mieter abrechnen.`
          : "Nimmt an der NK-Umlage nicht teil."}</p>
      </div>`;
    }).join("")}
    <div class="card">
      <div style="padding:12px 16px 2px"><b style="font-size:14px;color:#1f2937">Belege der Abrechnung (${kand.length})</b>
        <p style="font-size:11px;color:#94a3b8;margin-top:2px">✓ = wird umgelegt · per Tipp umschalten · Anteile: ${uUnits.join(" / ")} / Leerstand</p></div>
      ${kand.length === 0 ? `<div class="empty">Keine umlagefähigen Belege im ${year}.</div>` :
        kand.map(({b, a}) => `
        <div class="bkrow">

            onclick="toggleNk('${b.id}')" title="Umlage umschalten">${inUmlage(b) ? "✓" : "✕"}</button>
          <div class="bkmain">
            <div class="t">${esc(b.category)}</div>
            <div class="d">${fmtDate(b.date)}${b.note ? " · " + esc(b.note) : ""}
              <span style="color:#94a3b8"> · ${uUnits.map(u => u + " " + eur(a[u])).join(" · ")}${Math.abs(a.LS) > 0.005 ? " · LS " + eur(a.LS) : ""}</span></div>
          </div>
          <span class="bkamount" style="${inUmlage(b) ? "" : "color:#cbd5e1;text-decoration:line-through"}">${eur(b.amount)}</span>
        </div>`).join("")}
    </div>`;
}
function toggleNk(id) {

function renderEur(el) {
  const p = project();
  const bk = p.bookings.filter(b => yearOf(b.date) === year);
  const ein = bk.filter(b=>b.type==="einnahme").reduce((s,b)=>s+b.amount,0);
  const wkp = bk.filter(b=>b.type==="ausgabe"&&b.taxStatus===1).reduce((s,b)=>s+b.amount,0);
  const afa = bk.filter(b=>b.type==="ausgabe"&&b.taxStatus===3).reduce((s,b)=>s+b.amount,0);
  const priv = bk.filter(b=>b.type==="ausgabe"&&b.taxStatus===2).reduce((s,b)=>s+b.amount,0);
  const offL = bk.filter(b=>b.type==="ausgabe"&&b.taxStatus===4);
  const offS = offL.reduce((s,b)=>s+b.amount,0);

  const byCat = (t, st) => {
    const m = new Map();
    bk.filter(b => b.type===t && (t==="einnahme" || b.taxStatus===st))
      .forEach(b => m.set(b.category,(m.get(b.category)||0)+b.amount));
    return [...m.entries()].sort((a,b)=>b[1]-a[1]);
  };
  const row = (label, val, cls="") => `<div class="eurrow ${cls}"><span>${label}</span><span>${val}</span></div>`;

  el.innerHTML = `

    </div>

      <h3>EÜR ${year} · ${esc(p.name)} (4-Stufen-Modell)</h3>
      <div class="eursep"></div>
      ${byCat("einnahme").map(([c,s]) => row(esc(c), eur(s))).join("")}
      ${row("Summe Einnahmen", eur(ein), "sum")}
      <div class="eursep"></div>
      ${byCat("ausgabe",1).map(([c,s]) => row("Werbungskosten · "+esc(c), fmt(s))).join("")}
      ${row("Summe Werbungskosten (sofort abziehbar)", fmt(wkp), "sum")}
      <div class="eursep"></div>
      ${row("Überschuss der EÜR", eur(ein-wkp), "head")}
    </div>
    <div class="card" style="background:var(--card)">
      <h3>Info-Positionen (nicht in der EÜR enthalten)</h3>
      ${row("Über Abschreibung (AfA)", eur(afa), "info")}
      ${row("Nicht abziehbar (Tilgung, Rücklage, privat)", eur(priv), "info")}
      ${row("Noch zu klären "+(offL.length?`<span class="eurbadge">${offL.length}</span>`:""), eur(offS), "info")}
      <div class="smallhint" style="padding:0 16px 14px">Nur Belege mit Status „Sofort abziehbar“ fließen als Werbungskosten in die EÜR ein.
      „Noch zu klären“ wird ausgeklammert, bis du es einordnest.</div>
    </div>`;
}

function addProject() {
  const name = document.getElementById("np-name").value.trim();
  if (!name) { toast("Bitte einen Namen angeben"); return; }
  state.projects.push({
    id: uid(), name,
    address: document.getElementById("np-addr").value.trim(),
    units: document.getElementById("np-units").value.split(",").map(s=>s.trim()).filter(Boolean),
    bookings: []
  });
  saveState(); renderChrome(); route(); toast('Objekt „'+name+'“ angelegt');
}
function renameProject(id, name) {
  const p = state.projects.find(x=>x.id===id); const n = name.trim();
  if (n && p) { p.name = n; saveState(); renderChrome(); }
}
function setUnits(id, val) {
  const p = state.projects.find(x=>x.id===id);
  if (p) { p.units = val.split(",").map(s=>s.trim()).filter(Boolean); saveState(); }
}
function delProject(id) {
  const p = state.projects.find(x=>x.id===id);
  if (!p || !confirm(`Objekt „${p.name}“ mit ${p.bookings.length} Buchungen endgültig löschen?`)) return;
  state.projects = state.projects.filter(x=>x.id!==id);
  if (state.activeProjectId===id) state.activeProjectId = state.projects[0].id;
  saveState(); renderChrome(); route(); toast("Objekt gelöscht");
}

function renderBookingModal() {

        <select onchange="form.unit = this.value==='keine' ? '' : this.value;renderBookingModal()">

        <div class="taxgrid">${[1,2,3,4].map(s =>
          `<button class="taxopt ${form.taxStatus===s?"on":""}" onclick="form.taxStatus=${s};renderBookingModal()">${TAX[s].label}</button>`).join("")}</div>

function closeBooking() {

  form = null; editingId = null;
}
function setType(t) {
  form.type = t;
  form.category = t === "einnahme" ? CAT_E[0] : CAT_A[0];
  if (t === "einnahme") form.taxStatus = 1;
  else if (AUTO_NICHT_ABZIEHBAR.has(form.category)) form.taxStatus = 2;
  renderBookingModal();
}
function setCategory(c) {
  form.category = c;
  if (AUTO_NICHT_ABZIEHBAR.has(c)) form.taxStatus = 2;
  else if (form.taxStatus === 2 && !AUTO_NICHT_ABZIEHBAR.has(c) && form.type === "ausgabe") form.taxStatus = 4;
  renderBookingModal();
}
function pickPhoto(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1000, scale = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.width * scale));
      cv.height = Math.max(1, Math.round(img.height * scale));
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      form.photo = cv.toDataURL("image/jpeg", 0.65);
      renderBookingModal();
    };
    img.src = String(reader.result);
  };
  reader.readAsDataURL(file);
}
function saveBooking() {
  const p = project();
  const amount = parseAmount(document.getElementById("f-amount").value);
  form.date = document.getElementById("f-date").value;
  form.amount = amount;
  form.note = document.getElementById("f-note").value;
  if (!form.date || isNaN(amount) || amount === 0) { toast("Bitte Datum und Betrag prüfen"); return; }
  if (editingId) {
    const i = p.bookings.findIndex(b => b.id === editingId);
    if (i >= 0) p.bookings[i] = { ...form, id: editingId };
  } else {
    p.bookings.unshift({ ...form, id: uid(), createdAt: new Date().toISOString() });
  }
  saveState(); closeBooking(); route();
  toast(editingId ? "Buchung aktualisiert" : "Buchung gespeichert");
}

/* ================= Einstellungen ================= */
function renderSettings(el) {
  const p = project();
  const nBookings = state.projects.reduce((s,x)=>s+x.bookings.length,0);
  const nPhotos = state.projects.reduce((s,x)=>s+x.bookings.filter(b=>b.photo).length,0);
  const kb = Math.round(JSON.stringify(state).length/1024);
  el.innerHTML = `
    ${storageOk ? "" : `<div class="storage-banner">⚠️ Der Browser blockiert die lokale Speicherung.
      Daten gelten nur für diese Sitzung – regelmäßig <b>Backup exportieren</b>!</div>`}
    <div class="card" style="padding:16px">
      <h3 style="padding:0 0 10px">📱 Als App installieren</h3>
      <p style="font-size:13px;color:#64748b;line-height:1.5">
        Diese Seite ist eine installierbare Web-App (PWA) – auf Android mit eigenem Icon, Vollbild und offline nutzbar.</p>
      ${deferredInstall
        ? `<div style="margin-top:12px"><button class="btn" onclick="doInstall()">📲 Jetzt als App installieren</button></div>`
        : `<p style="font-size:13px;color:#64748b;line-height:1.5;margin-top:8px">Der Button erscheint automatisch, sobald Chrome bereit ist – ggf. Seite einmal <b>neu laden</b>. Alternativ: Menü ⋮ → <b>„App installieren“</b> bzw. <b>„Zum Startbildschirm hinzufügen“</b>.</p>`}
    </div>
    <div class="card" style="padding:16px">
      <h3 style="padding:0 0 10px">💾 Backup</h3>
      <p class="smallhint" style="margin-bottom:10px">${state.projects.length} Objekte · ${nBookings} Buchungen ·
        ${nPhotos} Belegfotos · ca. ${kb} KB</p>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        <button class="btn" onclick="exportBackup()">⬇ Backup exportieren (JSON)</button>
        <label class="btn outline">⬆ Backup importieren
          <input type="file" accept="application/json,.json" style="display:none"
            onchange="importBackup(this.files[0])"></label>
      </div>
    </div>
    <div class="card" style="padding:16px">
      <h3 style="padding:0 0 10px">CSV-Import aus Excel</h3>
      <p class="smallhint" style="margin-bottom:8px">
        Format: <code>Datum;Typ;Betrag;Kategorie;Vermerk;Einheit;Steuer-Status</code> · Semikolon-getrennt ·
        Datum TT.MM.JJJJ · Betrag mit Komma · Import ins aktive Objekt <b>${esc(p.name)}</b>.</p>
      <div class="field"><textarea id="csv-text" rows="5"
        placeholder="01.03.2026;Ausgabe;89,50;Reparatur & Wartung;Handwerker;W1;sofort abziehbar"></textarea></div>
      <button class="btn" onclick="importCSV()">CSV importieren</button>
    </div>
    <div class="card" style="padding:16px;background:var(--card)">
      <h3 style="padding:0 0 10px;color:#64748b">Alle Daten zurücksetzen</h3>
      <p class="smallhint" style="margin-bottom:10px">Löscht sämtliche Objekte und Buchungen in dieser App
        (die eingebetteten Buchungen aus der Migration werden wiederhergestellt).</p>
      <button class="btn danger" onclick="resetAll()">Zurücksetzen …</button>
    </div>
    <p class="smallhint" style="text-align:center">hausbuch. · alle Daten bleiben lokal auf deinem Gerät</p>`;
}
function exportBackup() {
  const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), data: state })],
    { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hausbuch-backup-" + todayISO() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast("Backup exportiert");
}
function importBackup(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = JSON.parse(String(r.result));
      const d = parsed.data || parsed;
      if (!d.projects || !Array.isArray(d.projects)) throw new Error("Format");
      state = d; state.activeProjectId = state.projects[0].id;
      saveState(); renderChrome(); route();
      toast("Backup importiert: " + d.projects.length + " Objekte");
    } catch (e) { toast("Ungültige Backup-Datei"); }
  };
  r.readAsText(file);
}
function parseGermanDate(s) {
  const t = (s||"").trim();
  let m = t.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (m) return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  m = t.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return t;
  return null;
}
function parseTaxStatus(s) {
  const t = (s||"").toLowerCase();
  if (["1","sofort abziehbar","abziehbar","steuerlich"].some(k=>t.includes(k))) return 1;
  if (["2","nicht abziehbar","privat","tilgung","rücklage","ruecklage"].some(k=>t.includes(k))) return 2;
  if (["3","afa","abschreibung"].some(k=>t.includes(k))) return 3;
  return 4;
}
function importCSV() {
  const text = document.getElementById("csv-text").value;
  const p = project();
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  let ok = 0, skipped = 0;
  for (const line of lines) {
    const c = line.split(/;|\t/).map(x => x.trim().replace(/^"|"$/g, ""));
    if (/datum/i.test(c[0])) continue;
    const date = parseGermanDate(c[0]||"");
    const amount = parseAmount(c[2]||"");
    if (!date || isNaN(amount) || amount === 0) { skipped++; continue; }
    const rt = (c[1]||"").toLowerCase();
    const type = /einnahme|miete|gutschrift|haben/.test(rt) ? "einnahme"
      : /ausgabe|soll/.test(rt) ? "ausgabe" : amount < 0 ? "ausgabe" : "einnahme";
    p.bookings.push({
      id: uid(), date, type,
      category: c[3] || "Sonstiges",
      amount: type === "ausgabe" ? amount : Math.abs(amount),
      note: c[4] || "", unit: c[5] || "",
      taxStatus: type === "einnahme" ? 1 : parseTaxStatus(c[6]||""),
      createdAt: new Date().toISOString()
    });
    ok++;
  }
  document.getElementById("csv-text").value = "";
  saveState(); route();
  toast(ok + " Buchungen importiert" + (skipped ? ", " + skipped + " übersprungen" : ""));
}
function resetAll() {
  if (!confirm("Wirklich ALLE Daten zurücksetzen?")) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  loadState(); saveState(); renderChrome(); route(); toast("App zurückgesetzt");
}

/* ================= Init ================= */
document.getElementById("fab").addEventListener("click", () => openBooking());
window.addEventListener("hashchange", route);
loadState();
if (!years().includes(year)) { year = years()[0]; }
route();
/* ---- PWA-Installation (Android/Chrome) ---- */
var deferredInstall = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstall = e;
  const h = location.hash || "#dashboard";
  if (h === "#einstellungen") route();
});
async function doInstall() {
  if (!deferredInstall) { toast("Chrome ist noch nicht bereit – bitte Seite einmal neu laden."); return; }
  deferredInstall.prompt();
  const c = await deferredInstall.userChoice;
  deferredInstall = null;
  if (location.hash === "#einstellungen") route();
  if (c && c.outcome === "accepted") toast("hausbuch. wird installiert – gleich auf dem Startbildschirm! 🎉");
}
window.addEventListener("appinstalled", () => {
  deferredInstall = null;
  toast("App installiert! Du findest hausbuch. jetzt auf dem Startbildschirm.");
  if (location.hash === "#einstellungen") route();
});
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
